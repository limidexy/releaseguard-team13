<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f8f7"><meta name="description" content="ReleaseGuard evaluation evidence and independent release review.">
  <title>ReleaseGuard · Evidence console</title>
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skip"></a>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#details" translate="no"><span class="brand-mark" aria-hidden="true">rg</span>ReleaseGuard</a>
    <div class="workspace-label"><span class="workspace-avatar" aria-hidden="true">13</span><div><strong>Team 13</strong><span data-i18n="workspace"></span></div></div>
    <nav aria-label="Workspace" id="navigation">
      <a href="#details" class="nav-link" data-view="details"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="navEvidence"></span></a>
      <a href="#history" class="nav-link" data-view="history"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="navHistory"></span><span class="nav-count" id="historyCount">0</span></a>
      <a href="#comparePanel" class="nav-link" data-view="comparePanel"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="navCompare"></span></a>
      <a href="#reviewPanel" class="nav-link" data-view="reviewPanel"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="navReview"></span><span class="nav-count" id="reviewCount">0</span></a>
    </nav>
    <div class="sidebar-bottom"><strong data-i18n="localOnly"></strong><p data-i18n="sidebarHint"></p><span class="build-label" translate="no">ReleaseGuard / 2.2</span></div>
  </aside>
  <div class="main-shell">
    <header class="topbar"><div class="breadcrumb"><span>Team 13</span><span aria-hidden="true">/</span><strong id="breadcrumb" data-i18n="navEvidence"></strong></div><div class="topbar-controls"><span class="local-label" data-i18n="localOnly"></span><label class="sr-only" for="language" data-i18n="language"></label><select id="language" name="language"><option value="zh">中文</option><option value="en">English</option></select></div></header>
    <main id="main" tabindex="-1">
      <div class="page-heading"><div><h1 id="pageTitle" data-i18n="navEvidence"></h1><p id="pageLead" data-i18n="evidenceLead"></p></div><button id="newEvaluation" data-i18n="newEvaluation"></button></div>
      <div class="boundary"><span class="boundary-label" data-i18n="evidenceBoundary"></span><p data-i18n="boundary"></p></div>
      <details class="configuration" id="connection" open>
        <summary><span data-i18n="identity"></span><span class="connection-state" id="connectionState" data-i18n="notConnected"></span></summary>
        <div class="disclosure-body">
          <div class="connection-grid"><div><label for="token" data-i18n="token"></label><input id="token" name="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="tokenHint"><p class="hint" id="tokenHint" data-i18n="tokenHint"></p></div><button id="refresh" class="secondary" data-i18n="refresh"></button></div>
          <div class="row"><div><label for="appId" data-i18n="appId"></label><input id="appId" name="appId" autocomplete="off" spellcheck="false"></div><div><label for="suiteId" data-i18n="suiteId"></label><input id="suiteId" name="suiteId" autocomplete="off" spellcheck="false"></div></div>
          <div class="configuration-footer"><p class="hint" data-i18n="setupHint"></p><button id="setup" class="secondary" data-i18n="setup"></button></div>
        </div>
      </details>
      <details class="composer" id="composer">
        <summary data-i18n="submitTitle"></summary>
        <div class="disclosure-body"><div class="row"><div><label for="candidate" data-i18n="candidate"></label><input id="candidate" name="candidate" value="support-prompt-v1" autocomplete="off" spellcheck="false"><label for="source" data-i18n="source"></label><select id="source" name="source"><option value="replay" data-i18n="replay"></option><option value="real" data-i18n="real"></option><option value="imported" data-i18n="imported"></option></select></div><div><label for="prompt" data-i18n="prompt"></label><select id="prompt" name="prompt"><option>v1</option><option>v2</option></select><label for="scenario" data-i18n="scenario"></label><select id="scenario" name="scenario"><option value="passing" data-i18n="passing"></option><option value="failing" data-i18n="failing"></option><option value="error" data-i18n="error"></option></select></div></div>
          <label for="commitRef" data-i18n="commit"></label><input id="commitRef" name="commitRef" value="course-v2" autocomplete="off" spellcheck="false">
          <div id="importBox" hidden><label for="outputs" data-i18n="outputs"></label><textarea id="outputs" name="outputs" rows="4" autocomplete="off" spellcheck="false"></textarea></div>
          <div class="submit-footer"><p class="hint" id="sourceHint"></p><button id="submit" data-i18n="submit"></button></div>
        </div>
      </details>
      <div id="message" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="details" class="view" aria-labelledby="resultHeading">
        <div class="empty-state" id="emptyState"><span class="empty-mark" aria-hidden="true">rg</span><h2 data-i18n="emptyTitle"></h2><p data-i18n="emptyResult"></p><button id="startSetup" class="secondary" data-i18n="openSetup"></button></div>
        <div id="resultContent" hidden>
          <div class="result-header"><div><h2 id="resultHeading" data-i18n="resultTitle"></h2><p id="resultSummary"></p></div><div id="resultBadges" class="badge-group"></div></div>
          <div class="evidence-layout"><div class="evidence-main">
            <div id="kpis" class="kpis"></div>
            <div class="evidence-toolbar"><h3 data-i18n="caseEvidence"></h3><div class="segmented" aria-label="Case filter"><button id="allCases" class="filter-button" aria-pressed="true" data-i18n="allCases"></button><button id="failedCases" class="filter-button" aria-pressed="false" data-i18n="attentionCases"></button></div></div>
            <div class="scroll" tabindex="0" role="region" aria-label="Case evidence"><table class="case-table"><thead><tr><th scope="col" data-i18n="case"></th><th scope="col" data-i18n="status"></th><th scope="col" data-i18n="actual"></th><th scope="col" data-i18n="reason"></th></tr></thead><tbody id="cases"></tbody></table></div>
            <details class="raw-details"><summary data-i18n="raw"></summary><pre id="result" translate="no"></pre></details>
          </div><aside class="decision-panel" aria-labelledby="gateHeading"><h3 id="gateHeading" data-i18n="qualityGate"></h3><div id="gateBadge"></div><p id="gateExplanation"></p><dl id="decisionFacts"></dl><button id="requestSelected" data-i18n="request" disabled></button><p class="hint" data-i18n="decisionHint"></p><div class="provenance"><h3 data-i18n="provenance"></h3><p id="evidenceSource"></p><p class="hint" id="evidenceDisclaimer"></p></div></aside></div>
        </div>
      </section>
      <section id="history" class="view" hidden aria-labelledby="historyHeading">
        <div class="section-heading"><h2 id="historyHeading" data-i18n="jobsTitle"></h2><p class="hint" data-i18n="pageHint"></p></div>
        <div class="scroll" tabindex="0" role="region" aria-label="Job history"><table><thead><tr><th scope="col" data-i18n="candidate"></th><th scope="col" data-i18n="status"></th><th scope="col" data-i18n="source"></th><th scope="col" data-i18n="actions"></th></tr></thead><tbody id="jobs"></tbody></table></div>
        <div class="pagination"><button id="previous" class="secondary" data-i18n="previous"></button><span id="page"></span><button id="next" class="secondary" data-i18n="next"></button></div>
      </section>
      <section id="comparePanel" class="view" hidden aria-labelledby="compareHeading">
        <div class="section-heading"><h2 id="compareHeading" data-i18n="compareTitle"></h2><p class="hint" data-i18n="compareHint"></p></div>
        <div class="compare-controls"><div class="row"><div><label for="leftJob" data-i18n="left"></label><select id="leftJob" name="leftJob"></select></div><div><label for="rightJob" data-i18n="right"></label><select id="rightJob" name="rightJob"></select></div></div><button id="compare" data-i18n="compare"></button></div>
        <p id="comparisonNotice" class="comparison-notice"></p><div class="scroll" tabindex="0" role="region" aria-label="Candidate comparison"><table class="comparison-table"><thead><tr><th scope="col" data-i18n="case"></th><th scope="col" data-i18n="left"></th><th scope="col" data-i18n="right"></th></tr></thead><tbody id="comparison"></tbody></table></div>
      </section>
      <section id="reviewPanel" class="view" hidden aria-labelledby="reviewHeading">
        <div class="section-heading"><h2 id="reviewHeading" data-i18n="reviewTitle"></h2><p class="hint" data-i18n="reviewHint"></p></div>
        <div class="review-note"><label for="note" data-i18n="note"></label><textarea id="note" name="note" rows="3" autocomplete="off" aria-describedby="reviewNoteHint"></textarea><p class="hint" id="reviewNoteHint" data-i18n="reviewNoteHint"></p></div>
        <div class="scroll" tabindex="0" role="region" aria-label="Release review"><table><thead><tr><th scope="col" data-i18n="release"></th><th scope="col" data-i18n="status"></th><th scope="col" data-i18n="version"></th><th scope="col" data-i18n="actions"></th></tr></thead><tbody id="releases"></tbody></table></div>
      </section>
      <footer><span translate="no">ReleaseGuard</span><p data-i18n="footer"></p></footer>
    </main>
  </div>
</div>
</body>
</html>
