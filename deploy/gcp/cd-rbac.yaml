apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: releaseguard-cd
  namespace: releaseguard
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [registry, evaluation, governance, support, worker, gateway]
    verbs: [get, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [rg-config]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [registry, evaluation, governance, support, worker, gateway]
    verbs: [get, patch, update]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: releaseguard-cd
  namespace: releaseguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: releaseguard-cd
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: rg-github-deploy@project-dcf9bb6a-7310-4602-aea.iam.gserviceaccount.com
