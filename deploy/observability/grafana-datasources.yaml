apiVersion: 1
datasources:
  - name: ReleaseGuard Logs
    uid: rg-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([a-f0-9]{32})"'
          datasourceUid: rg-jaeger
          url: '$${__value.raw}'
  - name: ReleaseGuard Traces
    uid: rg-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
