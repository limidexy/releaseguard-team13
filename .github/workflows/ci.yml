name: ReleaseGuard verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Enable only after the owner verifies included minutes and a zero-spend budget.
    if: vars.RG_ENABLE_HOSTED_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Every Compose operation, including fault/recovery checks, uses this runner-only project.
      COMPOSE_PROJECT_NAME: rg-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Cross-platform tooling regressions
        run: node --test tests/windows-compat.test.mjs tests/tooling-checkout.test.mjs tests/tooling-consumers.test.mjs
      - name: Replay metrics and scale-evidence regressions
        run: node --test tests/replay-metrics.test.mjs tests/replay-timeline.test.mjs
      - name: Submission CI wrapper regressions
        run: node --test tests/submission-ci.test.mjs
      - name: Image configuration identity regressions
        run: node --test tests/image-identity.test.mjs
      - name: CD identity gate regressions (offline)
        run: node --test tests/cd-identity.test.mjs
      - name: Disposable contract target safety regressions (offline)
        run: node --test tests/contracts-entry-guard.test.mjs tests/contracts-target.test.mjs
      - run: node scripts/setup-local.mjs
      - run: docker compose build gateway postgres
      - run: docker compose up -d --no-build --wait
      - name: Submission deadlines and database atomicity integration
        shell: bash
        env:
          RG_SUBMISSION_INTEGRATION: '1'
          RELEASEGUARD_URL: http://127.0.0.1:5189
        run: |
          mkdir -p evidence
          node scripts/verify-submission.mjs | tee evidence/submission-integration.log
      - name: Re-evaluation lineage and legacy migration integration
        env:
          RG_LINEAGE_INTEGRATION: '1'
          RELEASEGUARD_URL: http://127.0.0.1:5189
        run: node scripts/verify-lineage.mjs
      - name: Versioned policy and retained evidence integration
        env:
          RG_RETURNS_INTEGRATION: '1'
          RELEASEGUARD_URL: http://127.0.0.1:5189
        run: node scripts/verify-returns.mjs
      - name: Isolated service-fault and business-contract integration
        env:
          RG_CONTRACTS_INTEGRATION: '1'
          RELEASEGUARD_URL: http://127.0.0.1:5189
        run: node scripts/verify-contracts.mjs
      - run: node scripts/verify.mjs --restart
      - run: node scripts/fault-test.mjs
      - name: Dependency advisory gate
        run: npm audit --audit-level=high --json > evidence/dependency-audit.json
      - name: Image advisory gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # verified v0.36.0
        with:
          image-ref: releaseguard-course-v2:local
          format: json
          output: evidence/image-audit.json
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Save tested image and source identity
        run: |
          docker image inspect releaseguard-course-v2:local --format '{{.Id}}' > evidence/image-id.txt
          git rev-parse HEAD > evidence/source-commit.txt
          docker save releaseguard-course-v2:local -o image.tar
          node scripts/image-identity.mjs archive image.tar evidence/image-config-id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: image.tar
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: evidence/
      - name: Stop containers
        if: always()
        run: docker compose stop
  windows-tooling:
    # Public-repository standard runner; no install, Docker, cloud or model steps.
    if: vars.RG_ENABLE_HOSTED_CI == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native Windows tooling regressions
        run: node --test tests/windows-compat.test.mjs tests/tooling-checkout.test.mjs tests/tooling-consumers.test.mjs
