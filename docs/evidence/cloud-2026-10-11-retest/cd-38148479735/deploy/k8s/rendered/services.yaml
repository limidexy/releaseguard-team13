{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "rg-config",
    "namespace": "releaseguard"
  },
  "data": {
    "AUTH_MODE": "oidc",
    "AUTH_ISSUER": "https://rg-team13.34.21.137.20.sslip.io/auth/realms/releaseguard",
    "OIDC_JWKS_URL": "https://rg-team13.34.21.137.20.sslip.io/auth/realms/releaseguard/protocol/openid-connect/certs",
    "PUBLIC_ORIGIN": "https://rg-team13.34.21.137.20.sslip.io",
    "RUNNER_ORIGINS": "http://support:8080",
    "REGISTRY_URL": "http://registry:8080",
    "EVALUATION_URL": "http://evaluation:8080",
    "GOVERNANCE_URL": "http://governance:8080",
    "LEASE_MS": "60000",
    "RG_DEPLOYMENT_ENV": "gcp-trial"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "registry",
    "namespace": "releaseguard"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "RollingUpdate",
      "rollingUpdate": {
        "maxUnavailable": 0,
        "maxSurge": 1
      }
    },
    "selector": {
      "matchLabels": {
        "app": "registry"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "registry",
          "app.kubernetes.io/part-of": "releaseguard"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 30,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1000,
          "runAsGroup": 1000
        },
        "containers": [
          {
            "name": "registry",
            "image": "asia-southeast1-docker.pkg.dev/project-dcf9bb6a-7310-4602-aea/releaseguard/app@sha256:bf65c5b7ceda61fd44af68c65b38e32dc22933b0809f3833b8a44a8d7dc9de6b",
            "imagePullPolicy": "IfNotPresent",
            "envFrom": [
              {
                "configMapRef": {
                  "name": "rg-config"
                }
              }
            ],
            "env": [
              {
                "name": "SERVICE_ROLE",
                "value": "registry"
              },
              {
                "name": "INTERNAL_SECRET",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "rg-internal",
                    "key": "INTERNAL_SECRET",
                    "optional": false
                  }
                }
              },
              {
                "name": "NODE_EXTRA_CA_CERTS",
                "value": "/trust/ca.crt"
              },
              {
                "name": "DATABASE_URL",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "rg-registry",
                    "key": "DATABASE_URL",
                    "optional": false
                  }
                }
              }
            ],
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "384Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8080
              },
              "periodSeconds": 5,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8080
              },
              "periodSeconds": 5
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              },
              "periodSeconds": 10
            },
            "volumeMounts": [
              {
                "name": "trust",
                "mountPath": "/trust",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "trust",
            "secret": {
              "secretName": "rg-internal-ca"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "registry",
    "namespace": "releaseguard"
  },
  "spec": {
    "selector": {
      "app": "registry"
    },
    "ports": [
      {
        "port": 8080,
        "targetPort": 8080
      }
    ],
    "type": "ClusterIP"
  }
}
